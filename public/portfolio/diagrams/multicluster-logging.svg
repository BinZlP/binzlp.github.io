<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 690" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Service logging pipeline</title>
<desc id="diagram-description">Service activity produces records that pass through log collection, an ingestion buffer, and log processing. Queryable history supports operational investigation. Lifecycle management supports collection and processing.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 10 5 0 10Z" fill="#2563eb"/>
</marker>
<marker id="control-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0 0 10 5 0 10Z" fill="#64748b"/>
</marker>
</defs>
<style>text{font-family:Geist,'Segoe UI',system-ui,sans-serif;fill:#172033}.title{font-size:24px;font-weight:600}.group-label{font-size:18px;font-weight:600;fill:#1d4ed8}.label{font-size:18px;font-weight:600}.body{font-size:18px}.small{font-size:16px;fill:#475569}.group{fill:#f8fafc;stroke:#dbe3ee;stroke-width:1.5}.node{fill:white;stroke:#aebdce;stroke-width:1.5}.accent-node{fill:#eff6ff;stroke:#93b4ec;stroke-width:1.5}.flow{fill:none;stroke:#2563eb;stroke-width:2;stroke-linejoin:round}.control{fill:none;stroke:#64748b;stroke-width:1.7;stroke-dasharray:7 5;stroke-linejoin:round}</style>
<rect width="1120" height="690" fill="white"/>
<text x="32" y="36" class="title" text-anchor="start">Service logging pipeline</text>
<text x="32" y="66" class="small" text-anchor="start">Separate collection, buffering, processing, and log use</text>
<rect x="32" y="108" width="1056" height="238" rx="12" class="group"/>
<text x="56" y="140" class="group-label" text-anchor="start">Log data flow</text>
<rect x="56" y="170" width="184" height="110" rx="8" class="node"/>
<text x="148" y="200" class="label" text-anchor="middle">Service</text>
<text x="148" y="224" class="label" text-anchor="middle">activity</text>
<text x="148" y="260" class="small" text-anchor="middle">Produce log records</text>
<rect x="288" y="170" width="184" height="110" rx="8" class="node"/>
<text x="380" y="200" class="label" text-anchor="middle">Log</text>
<text x="380" y="224" class="label" text-anchor="middle">collection</text>
<text x="380" y="260" class="small" text-anchor="middle">Gather emitted records</text>
<rect x="520" y="170" width="184" height="110" rx="8" class="node"/>
<text x="612" y="200" class="label" text-anchor="middle">Ingestion</text>
<text x="612" y="224" class="label" text-anchor="middle">buffer</text>
<text x="612" y="260" class="small" text-anchor="middle">Retain pending records</text>
<rect x="752" y="170" width="312" height="110" rx="8" class="accent-node"/>
<text x="908" y="200" class="label" text-anchor="middle">Log processing</text>
<text x="908" y="260" class="small" text-anchor="middle">Prepare records for downstream use</text>
<path d="M240 225H288" class="flow" marker-end="url(#arrow)"/>
<path d="M472 225H520" class="flow" marker-end="url(#arrow)"/>
<path d="M704 225H752" class="flow" marker-end="url(#arrow)"/>
<rect x="520" y="414" width="568" height="204" rx="12" class="group"/>
<text x="544" y="446" class="group-label" text-anchor="start">Log consumption</text>
<rect x="544" y="476" width="248" height="96" rx="8" class="node"/>
<text x="668" y="506" class="label" text-anchor="middle">Queryable</text>
<text x="668" y="530" class="label" text-anchor="middle">history</text>
<text x="668" y="552" class="small" text-anchor="middle">Search and retain records</text>
<rect x="840" y="476" width="224" height="96" rx="8" class="node"/>
<text x="952" y="506" class="label" text-anchor="middle">Operations</text>
<text x="952" y="530" class="label" text-anchor="middle">view</text>
<text x="952" y="552" class="small" text-anchor="middle">Investigate service behavior</text>
<path d="M908 280V382H760V476" class="flow" marker-end="url(#arrow)"/>
<path d="M792 524H840" class="flow" marker-end="url(#arrow)"/>
<rect x="56" y="476" width="368" height="96" rx="8" class="node"/>
<text x="240" y="506" class="label" text-anchor="middle">Pipeline lifecycle</text>
<text x="240" y="552" class="small" text-anchor="middle">Maintain collectors and processors</text>
<path d="M240 476V398H380V280" class="control" marker-end="url(#control-arrow)"/>
<path d="M424 524H468V370H1104V150H988V170" class="control" marker-end="url(#control-arrow)"/>
<text x="32" y="668" class="small" text-anchor="start">Blue: requests, content and results</text>
<text x="574" y="668" class="small" text-anchor="start">Dashed: lifecycle management and observation</text>
</svg>
