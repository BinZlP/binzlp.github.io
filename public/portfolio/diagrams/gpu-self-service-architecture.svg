<path d="M552 360H386V260" class="flow" marker-end="url(#arrow)"/>
<path d="M280 236H244V410H122V244" class="flow" marker-end="url(#arrow)"/>
<rect x="32" y="482" width="1056" height="168" rx="12" class="group"/>
<text x="56" y="514" class="group-label" text-anchor="start">Usage and planning</text>
<rect x="56" y="540" width="284" height="82" rx="8" class="node"/>
<text x="198" y="570" class="label" text-anchor="middle">Usage collection</text>
