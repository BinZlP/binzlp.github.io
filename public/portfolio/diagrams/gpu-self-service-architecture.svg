<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Compute resource self service</title>
<desc id="diagram-description">Users request and manage compute resources through a self-service workspace. Lifecycle coordination applies resource actions and reports current state. Usage collection feeds reporting and capacity planning.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 10 5 0 10Z" fill="#2563eb"/>
</marker>
<marker id="control-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0 0 10 5 0 10Z" fill="#64748b"/>
</marker>
</defs>
<style>text{font-family:Geist,'Segoe UI',system-ui,sans-serif;fill:#172033}.title{font-size:24px;font-weight:600}.group-label{font-size:18px;font-weight:600;fill:#1d4ed8}.label{font-size:18px;font-weight:600}.body{font-size:18px}.small{font-size:16px;fill:#475569}.group{fill:#f8fafc;stroke:#dbe3ee;stroke-width:1.5}.node{fill:white;stroke:#aebdce;stroke-width:1.5}.accent-node{fill:#eff6ff;stroke:#93b4ec;stroke-width:1.5}.flow{fill:none;stroke:#2563eb;stroke-width:2;stroke-linejoin:round}.control{fill:none;stroke:#64748b;stroke-width:1.7;stroke-dasharray:7 5;stroke-linejoin:round}</style>
<rect width="1120" height="720" fill="white"/>
<text x="32" y="36" class="title" text-anchor="start">Compute resource self service</text>
<text x="32" y="66" class="small" text-anchor="start">Request resources, manage their lifecycle, and understand usage</text>
<rect x="32" y="148" width="180" height="96" rx="8" class="node"/>
<text x="122" y="178" class="label" text-anchor="middle">Resource</text>
<text x="122" y="202" class="label" text-anchor="middle">users</text>
<text x="122" y="224" class="small" text-anchor="middle">Request and manage</text>
<rect x="256" y="104" width="832" height="330" rx="12" class="group"/>
<text x="280" y="136" class="group-label" text-anchor="start">Resource lifecycle</text>
<rect x="280" y="164" width="212" height="96" rx="8" class="node"/>
<text x="386" y="194" class="label" text-anchor="middle">Self-service</text>
<text x="386" y="218" class="label" text-anchor="middle">workspace</text>
<text x="386" y="240" class="small" text-anchor="middle">Request and inspect</text>
<rect x="552" y="164" width="216" height="96" rx="8" class="node"/>
<text x="660" y="194" class="label" text-anchor="middle">Lifecycle</text>
<text x="660" y="218" class="label" text-anchor="middle">coordination</text>
<text x="660" y="240" class="small" text-anchor="middle">Create, update, release</text>
<rect x="828" y="164" width="236" height="96" rx="8" class="accent-node"/>
<text x="946" y="194" class="label" text-anchor="middle">Resource</text>
<text x="946" y="218" class="label" text-anchor="middle">provisioning</text>
<text x="946" y="240" class="small" text-anchor="middle">Apply lifecycle actions</text>
<path d="M212 196H244V212H280" class="flow" marker-end="url(#arrow)"/>
<path d="M492 212H552" class="flow" marker-end="url(#arrow)"/>
<path d="M768 212H828" class="flow" marker-end="url(#arrow)"/>
<rect x="828" y="318" width="236" height="84" rx="8" class="node"/>
<text x="946" y="348" class="label" text-anchor="middle">Compute resources</text>
<text x="946" y="382" class="small" text-anchor="middle">Run assigned workloads</text>
