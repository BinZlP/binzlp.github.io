<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Shared model access and evaluation</title>
<desc id="diagram-description">Developers and agent clients use a common interface to request model output. Dispatch and response delivery connect model execution to callers. Model preparation, a model catalog, evaluation runs, and comparison results support the serving lifecycle.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 10 5 0 10Z" fill="#2563eb"/>
</marker>
<marker id="control-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0 0 10 5 0 10Z" fill="#64748b"/>
</marker>
</defs>
<style>text{font-family:Geist,'Segoe UI',system-ui,sans-serif;fill:#172033}.title{font-size:24px;font-weight:600}.group-label{font-size:18px;font-weight:600;fill:#1d4ed8}.label{font-size:18px;font-weight:600}.body{font-size:18px}.small{font-size:16px;fill:#475569}.group{fill:#f8fafc;stroke:#dbe3ee;stroke-width:1.5}.node{fill:white;stroke:#aebdce;stroke-width:1.5}.accent-node{fill:#eff6ff;stroke:#93b4ec;stroke-width:1.5}.flow{fill:none;stroke:#2563eb;stroke-width:2;stroke-linejoin:round}.control{fill:none;stroke:#64748b;stroke-width:1.7;stroke-dasharray:7 5;stroke-linejoin:round}</style>
<rect width="1120" height="720" fill="white"/>
<text x="32" y="36" class="title" text-anchor="start">Shared model access and evaluation</text>
<text x="32" y="66" class="small" text-anchor="start">A common request path, model lifecycle, and repeatable comparison workflow</text>
<rect x="32" y="144" width="184" height="96" rx="8" class="node"/>
<text x="124" y="174" class="label" text-anchor="middle">Developers and</text>
<text x="124" y="198" class="label" text-anchor="middle">agent clients</text>
<text x="124" y="220" class="small" text-anchor="middle">Use available models</text>
<rect x="260" y="104" width="828" height="326" rx="12" class="group"/>
<text x="284" y="136" class="group-label" text-anchor="start">Model access</text>
<rect x="284" y="164" width="210" height="96" rx="8" class="node"/>
<text x="389" y="194" class="label" text-anchor="middle">Shared model</text>
<text x="389" y="218" class="label" text-anchor="middle">interface</text>
<text x="389" y="240" class="small" text-anchor="middle">Accept model requests</text>
<rect x="552" y="164" width="216" height="96" rx="8" class="node"/>
<text x="660" y="194" class="label" text-anchor="middle">Request</text>
<text x="660" y="218" class="label" text-anchor="middle">dispatch</text>
<text x="660" y="240" class="small" text-anchor="middle">Select a model endpoint</text>
<rect x="828" y="164" width="236" height="96" rx="8" class="accent-node"/>
<text x="946" y="194" class="label" text-anchor="middle">Model</text>
<text x="946" y="218" class="label" text-anchor="middle">execution</text>
<text x="946" y="240" class="small" text-anchor="middle">Generate output</text>
<path d="M216 192H246V212H284" class="flow" marker-end="url(#arrow)"/>
<path d="M494 212H552" class="flow" marker-end="url(#arrow)"/>
<path d="M768 212H828" class="flow" marker-end="url(#arrow)"/>
<rect x="552" y="316" width="216" height="82" rx="8" class="node"/>
<text x="660" y="346" class="label" text-anchor="middle">Response delivery</text>
<text x="660" y="378" class="small" text-anchor="middle">Return model output</text>
<path d="M946 260V357H768" class="flow" marker-end="url(#arrow)"/>
<path d="M552 357H124V240" class="flow" marker-end="url(#arrow)"/>
<rect x="32" y="480" width="1056" height="174" rx="12" class="group"/>
<text x="56" y="512" class="group-label" text-anchor="start">Model lifecycle and evaluation</text>
<rect x="56" y="540" width="220" height="86" rx="8" class="node"/>
<text x="166" y="566" class="label" text-anchor="middle">Model</text>
<text x="166" y="590" class="label" text-anchor="middle">preparation</text>
<text x="166" y="610" class="small" text-anchor="middle">Make models available</text>
<rect x="316" y="540" width="220" height="86" rx="8" class="node"/>
<text x="426" y="566" class="label" text-anchor="middle">Model</text>
<text x="426" y="590" class="label" text-anchor="middle">catalog</text>
<text x="426" y="610" class="small" text-anchor="middle">Track serving options</text>
<rect x="576" y="540" width="220" height="86" rx="8" class="node"/>
<text x="686" y="566" class="label" text-anchor="middle">Evaluation</text>
<text x="686" y="590" class="label" text-anchor="middle">runs</text>
<text x="686" y="610" class="small" text-anchor="middle">Run repeatable checks</text>
<rect x="836" y="540" width="228" height="86" rx="8" class="node"/>
<text x="950" y="566" class="label" text-anchor="middle">Comparison</text>
<text x="950" y="590" class="label" text-anchor="middle">results</text>
<text x="950" y="610" class="small" text-anchor="middle">Review model behavior</text>
<path d="M276 583H316" class="flow" marker-end="url(#arrow)"/>
<path d="M796 583H836" class="flow" marker-end="url(#arrow)"/>
<path d="M426 540V454H514V286H660V260" class="control" marker-end="url(#control-arrow)"/>
<path d="M686 540V466H802V144H880V164" class="control" marker-end="url(#control-arrow)"/>
<text x="32" y="698" class="small" text-anchor="start">Blue: requests, content and results</text>
<text x="574" y="698" class="small" text-anchor="start">Dashed: lifecycle management and observation</text>
</svg>
