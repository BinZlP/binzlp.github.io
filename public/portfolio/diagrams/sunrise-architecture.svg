<path d="M660 316V260" class="flow" marker-end="url(#arrow)"/>
<rect x="32" y="482" width="1056" height="172" rx="12" class="group"/>
<text x="56" y="514" class="group-label" text-anchor="start">Supporting capabilities</text>
