<text x="660" y="194" class="label" text-anchor="middle">Task</text>
<text x="660" y="218" class="label" text-anchor="middle">coordination</text>
<text x="660" y="240" class="small" text-anchor="middle">Plan the next action</text>
<rect x="828" y="164" width="236" height="96" rx="8" class="accent-node"/>
<text x="946" y="194" class="label" text-anchor="middle">Operational</text>
<text x="946" y="218" class="label" text-anchor="middle">actions</text>
<text x="946" y="240" class="small" text-anchor="middle">Inspect or execute</text>
<path d="M214 190H244V212H280" class="flow" marker-end="url(#arrow)"/>
<path d="M492 212H552" class="flow" marker-end="url(#arrow)"/>
<path d="M768 212H828" class="flow" marker-end="url(#arrow)"/>
