<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes code-judging architecture</title>
  <desc id="desc">Users enter an Amazon EKS cluster through ALB for service APIs and NLB for execution traffic. Business, resource allocator, code-storage, and evaluation services form the service layer. Code storage connects to Kafka and tiered Redis, Amazon FSx, and Amazon S3 storage. The allocator uses the Kubernetes API to schedule executor pods in small and large exam node pools. Karpenter scales nodes and KEDA scales services.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#047857"/></marker><marker id="scale-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#737373"/></marker></defs>
  <style>text{font-family:Geist,&quot;Segoe UI&quot;,system-ui,sans-serif;fill:#171717;font-size:18px}.group{fill:#fafafa;stroke:#d4d4d4;stroke-width:1.5}.node{fill:white;stroke:#a3a3a3;stroke-width:1.5}.label{font-weight:600}.small{font-size:16px;fill:#525252}.heading{font-size:18px;font-weight:600;fill:#047857}.flow{fill:none;stroke:#047857;stroke-width:2;marker-end:url(#arrow)}.scale{fill:none;stroke:#737373;stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#scale-arrow)}.bus{fill:none;stroke:#047857;stroke-width:2}</style>
