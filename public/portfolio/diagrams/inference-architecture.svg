<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">LLM inference routing and KV-cache offloading</title>
  <desc id="desc">Incoming requests pass through llm-d using approx-affinity routing to vLLM workers. The workers exchange KV-cache data with LMCache, which uses memory and storage cache tiers. The evaluated configuration was load-tested on one DGX-B300 node.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6b7280"/></marker>
    <style>
      text { font-family: Geist, 'Segoe UI', system-ui, sans-serif; fill: #1f2937; }
      .heading { font-size: 26px; font-weight: 600; }
      .label { font-size: 19px; font-weight: 600; }
      .detail { font-size: 17px; fill: #4b5563; }
      .note { font-size: 16px; fill: #4b5563; }
      .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; }
      .accent { fill: #fafafa; stroke: #047857; stroke-width: 2; }
      .flow { fill: none; stroke: #6b7280; stroke-width: 2; marker-end: url(#arrow); }
      .exchange { fill: none; stroke: #6b7280; stroke-width: 2; marker-start: url(#arrow); marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="960" height="600" rx="16" fill="#fafafa"/>
  <text class="heading" x="32" y="45">LLM inference platform</text>
  <text class="detail" x="32" y="75">Evaluated routing configuration and cache offloading</text>

  <rect class="box" x="32" y="128" width="224" height="100" rx="12"/>
  <text class="label" x="144" y="169" text-anchor="middle">Incoming requests</text>
  <text class="detail" x="144" y="199" text-anchor="middle">Model inference</text>

  <rect class="accent" x="332" y="128" width="242" height="100" rx="12"/>
  <text class="label" x="453" y="169" text-anchor="middle">llm-d router</text>
  <text class="detail" x="453" y="199" text-anchor="middle">approx-affinity</text>

  <rect class="box" x="650" y="128" width="278" height="100" rx="12"/>
  <text class="label" x="789" y="169" text-anchor="middle">vLLM workers</text>
  <text class="detail" x="789" y="199" text-anchor="middle">Model execution</text>

  <path class="flow" d="M256 178 H322"/>
  <path class="flow" d="M574 178 H640"/>

  <rect class="accent" x="454" y="306" width="278" height="88" rx="12"/>
  <text class="label" x="593" y="342" text-anchor="middle">LMCache</text>
  <text class="detail" x="593" y="371" text-anchor="middle">KV-cache offloading</text>
  <path class="exchange" d="M789 238 V270 H593 V296"/>
  <text class="note" x="625" y="258">KV-cache transfer</text>

  <rect class="box" x="326" y="464" width="240" height="78" rx="12"/>
  <text class="label" x="446" y="496" text-anchor="middle">Memory cache</text>
  <text class="detail" x="446" y="523" text-anchor="middle">L1 tier</text>

  <rect class="box" x="620" y="464" width="240" height="78" rx="12"/>
  <text class="label" x="740" y="496" text-anchor="middle">Storage cache</text>
  <text class="detail" x="740" y="523" text-anchor="middle">L2 tier</text>

  <path class="flow" d="M593 394 V428 H446 V454"/>
  <path class="flow" d="M593 428 H740 V454"/>
  <text class="note" x="32" y="576">Load testing used one DGX-B300 node. This view shows logical components, not a multi-node deployment.</text>
</svg>
