  <text class="label" x="303" y="328" text-anchor="middle">EC2</text>
  <text class="label" x="303" y="354" text-anchor="middle">build agents</text>
  <text class="small" x="303" y="394" text-anchor="middle">Node.js builds</text>
  <path class="flow" d="M378 362H412"/>
  <rect class="node" x="412" y="286" width="212" height="152" rx="6"/>
  <text class="label" x="518" y="318" text-anchor="middle">Build tools</text>
  <text class="small" x="518" y="352" text-anchor="middle">Webpack · Babel</text>
  <text class="small" x="518" y="381" text-anchor="middle">Turborepo</text>
  <text class="small" x="518" y="410" text-anchor="middle">Docker</text>
  <path class="flow" d="M648 353H712"/>
  <rect class="group" x="712" y="220" width="224" height="266" rx="8"/>
