<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Build and release workflow</title>
<desc id="diagram-description">Contributors submit changes to build coordination, build execution, artifact preparation, and release execution. Results return to the contributor. Shared build steps, reusable build data, and pipeline observation support maintenance.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 10 5 0 10Z" fill="#2563eb"/>
</marker>
<marker id="control-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0 0 10 5 0 10Z" fill="#64748b"/>
</marker>
</defs>
<style>text{font-family:Geist,'Segoe UI',system-ui,sans-serif;fill:#172033}.title{font-size:24px;font-weight:600}.group-label{font-size:18px;font-weight:600;fill:#1d4ed8}.label{font-size:18px;font-weight:600}.body{font-size:18px}.small{font-size:16px;fill:#475569}.group{fill:#f8fafc;stroke:#dbe3ee;stroke-width:1.5}.node{fill:white;stroke:#aebdce;stroke-width:1.5}.accent-node{fill:#eff6ff;stroke:#93b4ec;stroke-width:1.5}.flow{fill:none;stroke:#2563eb;stroke-width:2;stroke-linejoin:round}.control{fill:none;stroke:#64748b;stroke-width:1.7;stroke-dasharray:7 5;stroke-linejoin:round}</style>
<rect width="1120" height="720" fill="white"/>
<text x="32" y="36" class="title" text-anchor="start">Build and release workflow</text>
<text x="32" y="66" class="small" text-anchor="start">Reusable build steps, build outputs, and release execution</text>
<rect x="32" y="142" width="180" height="96" rx="8" class="node"/>
<text x="122" y="172" class="label" text-anchor="middle">Code</text>
<text x="122" y="196" class="label" text-anchor="middle">contributors</text>
<text x="122" y="218" class="small" text-anchor="middle">Submit changes</text>
<rect x="256" y="104" width="832" height="330" rx="12" class="group"/>
<text x="280" y="136" class="group-label" text-anchor="start">Delivery workflow</text>
<rect x="280" y="164" width="212" height="96" rx="8" class="node"/>
<text x="386" y="194" class="label" text-anchor="middle">Build</text>
<text x="386" y="218" class="label" text-anchor="middle">coordination</text>
<text x="386" y="240" class="small" text-anchor="middle">Start and track work</text>
<rect x="552" y="164" width="216" height="96" rx="8" class="node"/>
<text x="660" y="194" class="label" text-anchor="middle">Build</text>
<text x="660" y="218" class="label" text-anchor="middle">execution</text>
<text x="660" y="240" class="small" text-anchor="middle">Compile and package</text>
<rect x="828" y="164" width="236" height="96" rx="8" class="accent-node"/>
<text x="946" y="194" class="label" text-anchor="middle">Artifact</text>
<text x="946" y="218" class="label" text-anchor="middle">preparation</text>
<text x="946" y="240" class="small" text-anchor="middle">Retain release outputs</text>
<path d="M212 190H244V212H280" class="flow" marker-end="url(#arrow)"/>
<path d="M492 212H552" class="flow" marker-end="url(#arrow)"/>
<path d="M768 212H828" class="flow" marker-end="url(#arrow)"/>
<rect x="828" y="318" width="236" height="84" rx="8" class="node"/>
<text x="946" y="348" class="label" text-anchor="middle">Release execution</text>
<text x="946" y="382" class="small" text-anchor="middle">Deploy prepared outputs</text>
<rect x="552" y="318" width="216" height="84" rx="8" class="node"/>
<text x="660" y="348" class="label" text-anchor="middle">Build and release results</text>
<text x="660" y="382" class="small" text-anchor="middle">Report outcome and status</text>
<path d="M946 260V318" class="flow" marker-end="url(#arrow)"/>
<path d="M828 360H768" class="flow" marker-end="url(#arrow)"/>
<path d="M552 360H122V238" class="flow" marker-end="url(#arrow)"/>
<rect x="32" y="482" width="1056" height="172" rx="12" class="group"/>
<text x="56" y="514" class="group-label" text-anchor="start">Build reuse and maintenance</text>
<rect x="56" y="540" width="284" height="86" rx="8" class="node"/>
<text x="198" y="570" class="label" text-anchor="middle">Shared build steps</text>
<text x="198" y="606" class="small" text-anchor="middle">Reuse common build logic</text>
<rect x="398" y="540" width="298" height="86" rx="8" class="node"/>
<text x="547" y="570" class="label" text-anchor="middle">Reusable build data</text>
<text x="547" y="606" class="small" text-anchor="middle">Avoid repeated build work</text>
<rect x="754" y="540" width="310" height="86" rx="8" class="node"/>
<text x="909" y="570" class="label" text-anchor="middle">Pipeline observation</text>
<text x="909" y="606" class="small" text-anchor="middle">Review duration and failures</text>
<path d="M56 583H16V456H386V260" class="control" marker-end="url(#control-arrow)"/>
<path d="M547 540V448H514V286H660V260" class="flow" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M946 402V540" class="control" marker-end="url(#control-arrow)"/>
<text x="32" y="698" class="small" text-anchor="start">Blue: requests, content and results</text>
<text x="574" y="698" class="small" text-anchor="start">Dashed: lifecycle management and observation</text>
</svg>
