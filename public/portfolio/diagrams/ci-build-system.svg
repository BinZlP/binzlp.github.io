  <rect class="node" x="452" y="44" width="196" height="76" rx="6"/>
  <text class="label" x="550" y="76" text-anchor="middle">EC2 autoscaler</text>
  <text class="small" x="550" y="102" text-anchor="middle">Build capacity</text>
  <rect class="node" x="24" y="240" width="162" height="118" rx="6"/>
  <text class="label" x="105" y="272" text-anchor="middle">Jenkins</text>
  <text class="label" x="105" y="298" text-anchor="middle">Shared Libraries</text>
  <text class="small" x="105" y="331" text-anchor="middle">Groovy build scripts</text>
  <path class="flow" d="M105 240V172H313V120"/>
  <rect class="group" x="228" y="220" width="420" height="266" rx="8"/>
  <text class="heading" x="412" y="254">Build phase</text>
  <path class="flow" d="M550 120V184H312V286"/>
  <rect class="node" x="252" y="298" width="126" height="152" rx="6"/>
