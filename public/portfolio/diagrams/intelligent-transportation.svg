<rect x="858" y="158" width="206" height="96" rx="8" class="node"/>
<text x="961" y="188" class="label" text-anchor="middle">Service</text>
<text x="961" y="212" class="label" text-anchor="middle">runtime</text>
<text x="961" y="234" class="small" text-anchor="middle">Linux edge services</text>
