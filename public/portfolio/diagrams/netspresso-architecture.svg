<rect x="280" y="164" width="212" height="96" rx="8" class="node"/>
<text x="386" y="194" class="label" text-anchor="middle">Service</text>
<text x="386" y="218" class="label" text-anchor="middle">interface</text>
<text x="386" y="240" class="small" text-anchor="middle">Accept work and status</text>
