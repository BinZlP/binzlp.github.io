<text x="660" y="194" class="label" text-anchor="middle">Task</text>
<text x="660" y="218" class="label" text-anchor="middle">coordination</text>
<text x="660" y="240" class="small" text-anchor="middle">Manage pending work</text>
<rect x="828" y="164" width="236" height="96" rx="8" class="accent-node"/>
<text x="946" y="194" class="label" text-anchor="middle">Optimization</text>
<text x="946" y="218" class="label" text-anchor="middle">execution</text>
<text x="946" y="240" class="small" text-anchor="middle">Process model tasks</text>
